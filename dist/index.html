<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f6"><meta name="description" content="기프티콘 이미지와 쿠폰 번호를 보관하고 유효기간을 관리하는 나만의 기프티콘 포켓">
  <title>내 보관함 · 기프티콘 포켓</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="기프티콘 포켓">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="pocket.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="/install.js" defer></script>
</head>
<body>
  <svg class="defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="install" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></symbol>
      <symbol id="ticket" viewBox="0 0 24 24"><path d="M3 6h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4zM15 6v2m0 3v2m0 3v2"/></symbol>
      <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8 12 2.5 2.5 5.5-6"/></symbol>
      <symbol id="searchIcon" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.8"/><path d="m16 16 5 5"/></symbol>
      <symbol id="sortIcon" viewBox="0 0 24 24"><path d="M3 6h18M3 12h12M3 18h6"/></symbol>
      <symbol id="down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
      <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></symbol>
    </defs>
  </svg>
  <header class="site-header"><div class="wrap head-inner">
    <a class="brand" href="./"><img src="pocket.svg" alt="" width="36" height="36">기프티콘 포켓</a>
    <button type="button" id="install-button" class="header-add" hidden><svg aria-hidden="true"><use href="#install"/></svg>앱 설치</button>
    <button type="button" id="header-register" data-action="add" class="header-add"><svg><use href="#plus"/></svg>기프티콘 등록</button>
  </div></header>
  <div class="connection-status" role="status"><span id="offline-notice" hidden>오프라인으로 사용 중이에요.</span></div>
  <main class="wrap">
    <section class="hero">
      <div class="hero-copy">
        <h1>내 기프티콘 보관함<span>.</span></h1>
        <p>선물 받은 기프티콘을 모아두고,<br>유효기간이 지나기 전에 챙겨 쓰세요.</p>
        <button type="button" class="hero-add" data-action="add"><svg><use href="#plus"/></svg>기프티콘 등록</button>
      </div>
      <div class="hero-art" role="presentation"></div>
    </section>
    <section class="stats" aria-label="기프티콘 현황">
      <div class="stat"><span class="stat-icon lilac"><svg><use href="#ticket"/></svg></span><div><span class="stat-label">사용 가능</span><div class="stat-value"><b data-count="available">0</b><span>개</span></div></div></div>
      <div class="stat"><span class="stat-icon peach"><svg><use href="#clock"/></svg></span><div><span class="stat-label">만료 임박 <small>7일 이내</small></span><div class="stat-value"><b data-count="expiring">0</b><span>개</span></div></div></div>
      <div class="stat"><span class="stat-icon mint"><svg><use href="#check"/></svg></span><div><span class="stat-label">사용 완료</span><div class="stat-value"><b data-count="used">0</b><span>개</span></div></div></div>
    </section>
    <section class="collection" aria-labelledby="collection-heading">
      <div class="section-head"><h2 id="collection-heading">내 기프티콘 <span id="result-count">0</span></h2>
        <div class="tools"><label class="search"><svg><use href="#searchIcon"/></svg><input id="search" type="search" aria-label="브랜드 또는 상품명 검색" placeholder="브랜드 또는 상품명 검색"></label>
          <label class="sort"><svg><use href="#sortIcon"/></svg><select id="sort" aria-label="정렬 순서"><option value="expiry">만료 임박순</option><option value="newest">최신 등록순</option><option value="brand">브랜드순</option></select><svg class="chevron"><use href="#down"/></svg></label>
        </div>
      </div>
      <div class="filters" aria-label="기프티콘 상태 필터">
        <button data-filter="all" aria-pressed="true">전체</button><button data-filter="available" aria-pressed="false">사용 가능</button><button data-filter="expiring" aria-pressed="false">만료 임박</button><button data-filter="used" aria-pressed="false">사용 완료</button><button data-filter="expired" aria-pressed="false">기간 만료</button>
      </div>
      <div id="coupon-list"></div>
      <div class="empty" id="empty-state">
        <div class="empty-mark" aria-hidden="true"><svg viewBox="0 0 84 76" fill="none"><g stroke-linejoin="round" stroke-width="2.5"><path d="m15 28 38-16 11 26-38 16-3-8a5 5 0 0 0-4-9z" fill="#e9dbff" stroke="#695388"/><path d="m26 27 15-6" stroke="#ab91c8"/><path d="m23 34 44 6-1 9a5 5 0 0 0-1.3 10L64 67l-44-6 1-8a5 5 0 0 0 1.3-10z" fill="#ffbc85" stroke="#67483c"/><path d="m54 42-2.5 21" stroke="#996b51" stroke-dasharray="3 3"/><path d="m32 49 12 2m-13 4 8 1" stroke="#916746" stroke-linecap="round"/><path d="m65 18 3-5m3 12 6-1" stroke="#c3955c" stroke-linecap="round"/></g></svg></div>
        <h3>첫 기프티콘을 등록해 보세요</h3><p>등록한 기프티콘이 이곳에 모여요.</p>
        <button type="button" data-action="add" class="empty-add"><svg><use href="#plus"/></svg>기프티콘 등록</button>
      </div>
    </section>
  </main>
  <footer class="wrap"><svg><use href="#lock"/></svg>기프티콘은 이 기기에 저장돼요.</footer>
  <dialog id="install-guide" class="coupon-dialog" aria-labelledby="install-title">
    <div class="dialog-shell">
      <div class="dialog-header"><h2 id="install-title">기프티콘 포켓 설치</h2><form method="dialog"><button class="icon-button" aria-label="닫기">×</button></form></div>
      <img class="install-icon" src="/icons/icon-192.png" alt="" width="66" height="66">
      <ol id="install-steps" class="install-steps"></ol>
    </div>
  </dialog>
</body></html>
