<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1e1b23" media="(prefers-color-scheme: dark)"><meta name="description" content="기프티콘 이미지를 올리면 자동으로 등록하고, 유효기간을 확인하는 나만의 기프티콘 포켓">
  <title>내 보관함 · 기프티콘 포켓</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="기프티콘 포켓">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="./pocket.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body class="loading">
  <svg class="defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="install" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></symbol>
      <symbol id="ticket" viewBox="0 0 24 24"><path d="M3 6h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4zM15 6v2m0 3v2m0 3v2"/></symbol>
      <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8 12 2.5 2.5 5.5-6"/></symbol>
      <symbol id="searchIcon" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.8"/><path d="m16 16 5 5"/></symbol>
      <symbol id="sortIcon" viewBox="0 0 24 24"><path d="M3 6h18M3 12h12M3 18h6"/></symbol>
      <symbol id="tagIcon" viewBox="0 0 24 24"><path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></symbol>
      <symbol id="down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
      <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></symbol>
      <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.5 7.5 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.5 7.5 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 2.6-1.5l2.4 1 2-3.4z"/></symbol>
      <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m3.5 17 5-4.5 4 3.5 3-2.5 5 4"/></symbol>
      <symbol id="clipboard" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h4"/></symbol>
      <symbol id="share" viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></symbol>
      <symbol id="expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    </defs>
  </svg>
  <header class="site-header"><div class="wrap head-inner">
    <h1 class="brand-title"><a class="brand" href="./"><img src="./pocket.svg" alt="" width="36" height="36">기프티콘 포켓</a></h1>
    <div class="head-actions">
      <button type="button" id="install-button" class="header-button" hidden><svg aria-hidden="true"><use href="#install"/></svg>앱 설치</button>
      <button type="button" data-action="add" class="header-button header-register"><svg aria-hidden="true"><use href="#plus"/></svg>기프티콘 등록</button>
      <button type="button" id="settings-button" class="icon-button header-icon" aria-label="설정"><svg aria-hidden="true"><use href="#gear"/></svg></button>
    </div>
  </div></header>
  <div class="connection-status" role="status"><span id="offline-notice" hidden>오프라인으로 사용 중이에요.</span></div>
  <section id="banners" class="wrap banners" aria-label="안내"></section>
  <main class="wrap">
    <section class="hero">
      <div class="hero-copy">
        <h2>내 기프티콘 보관함<span>.</span></h2>
        <p>기프티콘 이미지만 올리면 자동으로 정리하고,<br>만료가 가까운 쿠폰부터 챙겨 드려요.</p>
        <button type="button" class="hero-add" data-action="add"><svg aria-hidden="true"><use href="#plus"/></svg>기프티콘 등록</button>
      </div>
      <div class="hero-art" role="presentation"></div>
    </section>
    <section class="stats" aria-label="기프티콘 현황">
      <button type="button" class="stat" data-filter="available" aria-pressed="false"><span class="stat-icon lilac"><svg aria-hidden="true"><use href="#ticket"/></svg></span><span class="stat-text"><span class="stat-label">사용 가능</span><span class="stat-value"><b data-count="available">0</b><span>개</span></span></span></button>
      <button type="button" class="stat" data-filter="expiring" aria-pressed="false"><span class="stat-icon peach"><svg aria-hidden="true"><use href="#clock"/></svg></span><span class="stat-text"><span class="stat-label">만료 임박 <small>7일 이내</small></span><span class="stat-value"><b data-count="expiring">0</b><span>개</span></span></span></button>
      <button type="button" class="stat" data-filter="used" aria-pressed="false"><span class="stat-icon mint"><svg aria-hidden="true"><use href="#check"/></svg></span><span class="stat-text"><span class="stat-label">사용 완료</span><span class="stat-value"><b data-count="used">0</b><span>개</span></span></span></button>
    </section>
    <section class="collection" aria-labelledby="collection-heading">
      <div class="section-head"><h2 id="collection-heading">내 기프티콘 <span id="result-count">0</span></h2>
        <div class="tools">
          <label class="search"><svg aria-hidden="true"><use href="#searchIcon"/></svg><input id="search" type="search" aria-label="브랜드, 상품명, 메모, 쿠폰 번호 검색" placeholder="브랜드, 상품명, 초성 검색" enterkeyhint="search"></label>
          <label class="select"><svg aria-hidden="true"><use href="#tagIcon"/></svg><select id="category" aria-label="카테고리"><option value="all">전체 카테고리</option><option>카페</option><option>외식</option><option>편의점</option><option>쇼핑</option><option>기타</option></select><svg class="chevron" aria-hidden="true"><use href="#down"/></svg></label>
          <label class="select"><svg aria-hidden="true"><use href="#sortIcon"/></svg><select id="sort" aria-label="정렬 순서"><option value="expiry">만료 임박순</option><option value="newest">최신 등록순</option><option value="brand">브랜드순</option></select><svg class="chevron" aria-hidden="true"><use href="#down"/></svg></label>
        </div>
      </div>
      <div class="filters" role="group" aria-label="기프티콘 상태 필터">
        <button type="button" data-filter="all" aria-pressed="true">전체</button><button type="button" data-filter="available" aria-pressed="false">사용 가능</button><button type="button" data-filter="expiring" aria-pressed="false">만료 임박</button><button type="button" data-filter="used" aria-pressed="false">사용 완료</button><button type="button" data-filter="expired" aria-pressed="false">기간 만료</button>
      </div>
      <div id="coupon-list"></div>
      <div class="empty" id="empty-state">
        <div class="empty-mark" aria-hidden="true"><svg viewBox="0 0 84 76" fill="none"><g stroke-linejoin="round" stroke-width="2.5"><path d="m15 28 38-16 11 26-38 16-3-8a5 5 0 0 0-4-9z" fill="#e9dbff" stroke="#695388"/><path d="m26 27 15-6" stroke="#ab91c8"/><path d="m23 34 44 6-1 9a5 5 0 0 0-1.3 10L64 67l-44-6 1-8a5 5 0 0 0 1.3-10z" fill="#ffbc85" stroke="#67483c"/><path d="m54 42-2.5 21" stroke="#996b51" stroke-dasharray="3 3"/><path d="m32 49 12 2m-13 4 8 1" stroke="#916746" stroke-linecap="round"/><path d="m65 18 3-5m3 12 6-1" stroke="#c3955c" stroke-linecap="round"/></g></svg></div>
        <h3>첫 기프티콘을 등록해 보세요</h3><p>기프티콘 이미지를 고르면 브랜드, 상품명, 유효기간이 자동으로 채워져요.</p>
        <button type="button" data-action="add" class="empty-add"><svg aria-hidden="true"><use href="#plus"/></svg>이미지로 등록</button>
        <p class="empty-tip" id="empty-tip"></p>
      </div>
    </section>
  </main>
  <footer class="wrap"><svg aria-hidden="true"><use href="#lock"/></svg>기프티콘 이미지와 쿠폰 번호는 이 기기에만 저장돼요.</footer>
  <button type="button" class="fab" data-action="add"><svg aria-hidden="true"><use href="#plus"/></svg>등록</button>
  <dialog id="install-guide" class="coupon-dialog" aria-labelledby="install-title">
    <div class="dialog-shell">
      <div class="dialog-header"><h2 id="install-title">기프티콘 포켓 설치</h2><form method="dialog"><button class="icon-button" aria-label="닫기"><svg aria-hidden="true"><use href="#close"/></svg></button></form></div>
      <img class="install-icon" src="./icons/icon-192.png" alt="" width="66" height="66">
      <ol id="install-steps" class="install-steps"></ol>
    </div>
  </dialog>
</body></html>
