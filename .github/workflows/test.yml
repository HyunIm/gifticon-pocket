# Pull requests are tested before they can be merged and deployed.
name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Tests use only Node itself; no npm install needed.
      - name: Test
        run: npm test

      # dist/sw.js lists every app file with its hash; a stale list breaks offline use.
      - name: Offline file list is up to date
        run: |
          npm run build
          git diff --exit-code -- dist/sw.js || { echo "::error::dist/sw.js is out of date. Run npm run build and commit it."; exit 1; }
