# Every push to main (including merged pull requests) is tested and published to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pushing the built site to the gh-pages branch.
permissions:
  contents: write

# One deploy at a time; a newer push waits instead of racing the current one.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Tests and the offline file list use only Node itself; no npm install needed.
      - name: Test
        run: npm test

      - name: Build offline file list
        run: npm run build

      - name: Publish dist/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish-gh-pages.sh
